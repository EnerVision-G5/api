name: cd

# Livraison de l'image Docker de l'API.
#
# À chaque poussée sur master (donc à chaque merge intégré), on rejoue d'abord
# l'intégralité de la CI (ruff + pytest + dérive du contrat) puis, seulement si
# elle passe, on construit l'image de production et on la publie sur GHCR en la
# taguant avec le SHA Git.
on:
  push:
    branches: [master]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Barrière qualité : réutilise ci.yml tel quel. `build` ne démarre pas tant
  # que ruff, pytest et le job contract-drift ne sont pas verts.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build & push image (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Nom d'image en minuscules (GHCR l'exige, le nom de repo peut contenir
      # des majuscules).
      - name: Préparer la référence d'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Jeton éphémère fourni par Actions, jamais stocké dans l'image.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Base du smoke test. Depuis que l'entrypoint applique les migrations,
      # l'image ne peut plus démarrer sans base : elle sortait en erreur sur
      # une résolution DNS avant même d'ouvrir le port, et le smoke test ne
      # mesurait plus que ça.
      #
      # Même image que la base de production : la révision 0001 crée
      # l'extension timescaledb et une hypertable, un Postgres nu les
      # refuserait.
      - name: Démarrer la base du smoke test
        run: |
          docker network create smoke-net
          docker run -d --name smoke-db --network smoke-net \
            -e POSTGRES_USER=smoke \
            -e POSTGRES_PASSWORD=smoke \
            -e POSTGRES_DB=smoke \
            -e TIMESCALEDB_TELEMETRY=off \
            --health-cmd 'pg_isready -U smoke -d smoke' \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            timescale/timescaledb:2.17.2-pg16
          ok=0
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' smoke-db)" \
                 = healthy ]; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1

      # Vérifie que l'image publiée démarre seule (aucune dépendance au poste de
      # dev), porte son schéma jusqu'à head, écoute sur le port attendu et lit
      # sa config depuis l'environnement.
      - name: Smoke test de l'image publiée
        run: |
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run -d --name api-smoke --network smoke-net -p 8080:8080 \
            -e ENVIRONMENT=production \
            -e DATABASE_URL='postgresql+asyncpg://smoke:smoke@smoke-db:5432/smoke' \
            -e JWT_SECRET='ci-smoke-throwaway-not-a-real-jwt-secret-0123456789' \
            "$ref"
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health; then ok=1; break; fi
            sleep 1
          done
          echo
          docker logs api-smoke
          test "$ok" = 1

      # Toujours exécuté : un smoke test rouge doit laisser le runner propre,
      # et les journaux de la base expliquent souvent l'échec de l'API.
      - name: Nettoyer le smoke test
        if: always()
        run: |
          docker logs smoke-db 2>&1 | tail -n 50 || true
          docker rm -f api-smoke smoke-db >/dev/null 2>&1 || true
          docker network rm smoke-net >/dev/null 2>&1 || true

      - name: Récapitulatif
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest : \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
