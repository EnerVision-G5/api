name: cd

# Livraison de l'image Docker de l'API : à chaque push sur master, et à la
# demande pour republier un commit déjà intégré (image de base corrigée, run
# précédent tombé au smoke test). Dans les deux cas la CI complète est rejouée
# d'abord ; rien n'est construit si elle échoue.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build & push image (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # GHCR exige un nom d'image en minuscules.
      - name: Préparer la référence d'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Connexion à GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer tags et labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build & push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # L'entrypoint applique les migrations : l'image ne démarre pas sans base.
      # Même image que la production (extension timescaledb, hypertable), sur la
      # boucle locale du runner et détruite avec lui, d'où l'absence de mot de
      # passe.
      - name: Démarrer la base du smoke test
        run: |
          docker network create smoke-net
          docker run -d --name smoke-db --network smoke-net \
            -e POSTGRES_USER=smoke \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=smoke \
            -e TIMESCALEDB_TELEMETRY=off \
            --health-cmd 'pg_isready -U smoke -d smoke' \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
          ok=0
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' smoke-db)" \
                 = healthy ]; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1

      # L'image doit démarrer seule, porter son schéma jusqu'à head et écouter
      # sur le port attendu. Clé de signature tirée au sort, jetée avec le runner.
      - name: Smoke test de l'image publiée
        run: |
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run -d --name api-smoke --network smoke-net -p 8080:8080 \
            -e ENVIRONMENT=production \
            -e DATABASE_URL='postgresql+asyncpg://smoke@smoke-db:5432/smoke' \
            -e JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            "$ref"
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health; then ok=1; break; fi
            sleep 1
          done
          echo
          docker logs api-smoke
          test "$ok" = 1

      # Les journaux de la base expliquent souvent l'échec de l'API.
      - name: Nettoyer le smoke test
        if: always()
        run: |
          docker logs smoke-db 2>&1 | tail -n 50 || true
          docker rm -f api-smoke smoke-db >/dev/null 2>&1 || true
          docker network rm smoke-net >/dev/null 2>&1 || true

      - name: Récapitulatif
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest : \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
