name: ci

on:
  push:
  pull_request:

env:
  # Branche du repo enervision qui porte le contrat gelé de référence.
  CONTRACTS_REF: develop

jobs:
  # EV-02 et EV-38 demandaient tous deux un job lint + tests. Un seul est
  # conservé, celui déjà sur develop, dont les outils sont épinglés par
  # requirements-dev.txt. EV-02 y ajoute le checkout récursif des submodules et
  # l'étape de build, qui pour ce repo est la génération de la spécification.
  lint-and-test:
    name: ruff + pytest + build
    runs-on: ubuntu-latest

    # Les tests des endpoints de lecture (EV-11) interrogent une vraie base et
    # non un double. Même image et même version que la base d'exploitation,
    # pour que le tri sur hypertable, le TEXT[] de null_reasons et les NUMERIC
    # se comportent en CI comme en production.
    services:
      test-db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: enervision_test
          POSTGRES_USER: enervision
          # Base éphémère, détruite avec le runner : ce mot de passe ne protège
          # rien, il n'a pas sa place dans les secrets du repo.
          POSTGRES_PASSWORD: enervision
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U enervision -d enervision_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://enervision:enervision@localhost:5433/enervision_test
        run: pytest

      - name: Build (génération de la spécification OpenAPI)
        run: python scripts/export_openapi.py > /dev/null

  contract-drift:
    name: Dérive du contrat OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Récupérer le contrat gelé
        uses: actions/checkout@v4
        with:
          repository: EnerVision-G5/enervision
          ref: ${{ env.CONTRACTS_REF }}
          path: enervision
          # Le GITHUB_TOKEN par défaut ne lit pas les autres repos privés de
          # l'organisation. On passe par une clé de déploiement en lecture seule
          # posée sur enervision, dont la partie privée est le secret ci-dessous.
          # Une clé de déploiement n'est liée à aucun compte, contrairement à un
          # PAT qui expire ou disparaît avec le départ de son porteur.
          ssh-key: ${{ secrets.CONTRACTS_SSH_KEY }}

      - name: Comparer le code au contrat gelé
        run: |
          python scripts/export_openapi.py > /tmp/openapi-current.json
          diff -u enervision/docs/contracts/openapi-api.json /tmp/openapi-current.json \
            || { echo "::error::Le code a dérivé du contrat gelé. Ouvrir une PR sur enervision/docs/contracts ou corriger le code."; exit 1; }
