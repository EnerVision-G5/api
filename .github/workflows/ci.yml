name: ci

# Sur chaque pull request et sur develop après fusion. master n'est pas listé :
# cd.yml rejoue cette CI en entier avant de construire l'image, un push sur
# master est donc testé une fois, pas deux.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

env:
  # Branche du repo enervision qui porte le contrat gelé de référence.
  CONTRACTS_REF: develop
  # Même image et même version que la base d'exploitation : tri sur
  # hypertable, TEXT[] et NUMERIC se comportent en CI comme en production.
  TIMESCALEDB_IMAGE: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12

jobs:
  lint-and-test:
    name: ruff + pytest + build
    runs-on: ubuntu-latest

    # Les tests des endpoints de lecture interrogent une vraie base, pas un
    # double. Base éphémère sur la boucle locale du runner, détruite avec lui :
    # un mot de passe n'y protégerait rien et ne serait qu'une valeur en clair
    # de plus dans le dépôt, d'où l'authentification `trust`.
    services:
      test-db:
        image: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
        env:
          POSTGRES_DB: enervision_test
          POSTGRES_USER: enervision
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U enervision -d enervision_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://enervision@localhost:5433/enervision_test
        run: pytest

      - name: Build (génération de la spécification OpenAPI)
        run: python scripts/export_openapi.py > /dev/null

  # Comparer au contrat un code dont les tests échouent n'apprend rien : le
  # contrat et les scans attendent le vert de lint-and-test.
  contract-drift:
    name: Dérive du contrat OpenAPI
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Récupérer le contrat gelé
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: EnerVision-G5/enervision
          ref: ${{ env.CONTRACTS_REF }}
          path: enervision
          # Le GITHUB_TOKEN ne lit pas les autres dépôts privés de l'organisation :
          # clé de déploiement en lecture seule posée sur enervision, qui ne
          # dépend d'aucun compte.
          ssh-key: ${{ secrets.CONTRACTS_SSH_KEY }}

      - name: Comparer le code au contrat gelé
        run: |
          python scripts/export_openapi.py > /tmp/openapi-current.json
          diff -u enervision/docs/contracts/openapi-api.json /tmp/openapi-current.json \
            || { echo "::error::Le code a dérivé du contrat gelé. Ouvrir une PR sur enervision/docs/contracts ou corriger le code."; exit 1; }

  # Bloquant sur les CVE High et Critical qui ont un correctif. Les exceptions
  # vivent dans .grype.yaml, datées et justifiées dans SECURITY.md.
  sca-grype:
    name: Grype (CVE corrigeables de l'image)
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Même Dockerfile que cd.yml : ce qui est scanné est ce qui sera publié.
      - name: Construire l'image à scanner
        run: docker build -t enervision-api:scan .

      - name: Grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          image: enervision-api:scan
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
          output-file: grype-report.txt

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### Grype — CVE corrigeables (>= high)"
            echo
            echo '```'
            cat grype-report.txt || echo "(aucun rapport produit)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grype-report
          path: grype-report.txt
          if-no-files-found: warn

  # Scan dynamique : l'API est démarrée puis attaquée par ZAP à partir de sa
  # propre spécification OpenAPI. Bloquant : toute alerte absente de
  # .zap/rules.tsv fait échouer le job.
  dast-zap:
    name: OWASP ZAP (scan de l'API)
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      scan-db:
        image: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
        env:
          POSTGRES_DB: enervision_scan
          POSTGRES_USER: enervision
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U enervision -d enervision_scan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://enervision@localhost:5434/enervision_scan
      SCAN_TARGET: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Les migrations, pas un create_all : le scan rencontre la base que
      # produit un vrai déploiement.
      - name: Construire le schéma de la base éphémère
        run: alembic upgrade head

      - name: Démarrer l'API à scanner
        env:
          ENVIRONMENT: ci
          # Sous JWT, ZAP ne verrait que des 401 et ne testerait aucun handler.
          # Réglage propre à ce job : la CD publie l'image sans y toucher.
          AUTH_ENABLED: "false"
        run: |
          # Clé de signature tirée au sort et jetée avec le runner.
          JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            nohup uvicorn app.main:app --host 127.0.0.1 --port 8080 \
            > uvicorn.log 2>&1 &
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "$SCAN_TARGET/api/v1/health" >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          cat uvicorn.log
          test "$ok" = 1

      # --network host pour atteindre l'uvicorn du runner. Le conteneur écrit
      # ses rapports sous l'uid 1000 alors que le runner est 1001 : le
      # répertoire dédié, vide et jeté avec le job, est ouvert en écriture.
      - name: OWASP ZAP
        run: |
          install -d -m 0777 zap-report
          cp .zap/rules.tsv zap-report/rules.tsv
          docker run --rm --network host \
            -v "$PWD/zap-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-api-scan.py \
              -t "$SCAN_TARGET/openapi.json" \
              -f openapi \
              -c rules.tsv \
              -r rapport.html \
              -w rapport.md \
              -J rapport.json

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### OWASP ZAP — scan de l'API"
            echo
            cat zap-report/rapport.md || echo "(aucun rapport produit)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: |
            zap-report/rapport.*
            uvicorn.log
          if-no-files-found: warn
