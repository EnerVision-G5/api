# Environnement de dev : code monté en volume, uvicorn --reload, Postgres.
# Démarrage : docker compose -f compose.dev.yml up --build
# (pense à `cp .env.example .env` au préalable)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      # Code source -> rechargement à chaud
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enervision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enervision}
      POSTGRES_DB: ${POSTGRES_DB:-enervision}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enervision}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
